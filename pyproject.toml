[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signaldeck-plugin-socketio"
version = "0.5.0"
description = "Socket.IO communication plugin for SignalDeck"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "signaldeck-sdk>=0.5.0",
  "flask>=3.0",
  "flask-socketio>=5.5,<6",
  "simple-websocket>=1.1,<2"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["plugins/."]
include = ["signaldeck_plugin_socketio*"]

[tool.setuptools.package-data]
signaldeck_plugin_socketio = [
  "templates/**/*", "locales/**/*", "samples/**/*"
]
